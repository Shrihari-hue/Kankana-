<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="robots" content="noindex"><title>Kankana document</title>
<script>
/* Older document links now open the PDF generated by the server. */
(function(){var q=new URLSearchParams(location.search),id=q.get('id'),t=q.get('type')||'quotation',k=q.get('key'),p=q.get('pay');
if(!id){location.replace('my-booking.html');return;}
var u='/api/docs/'+encodeURIComponent(id)+'/'+encodeURIComponent(t)+'.pdf',s=new URLSearchParams();if(k)s.set('key',k);if(p)s.set('pay',p);
location.replace(u+(s.toString()?'?'+s:''));})();
</script></head><body></body></html>
