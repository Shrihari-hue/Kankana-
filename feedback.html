<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Your Feedback — Kankana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:wght@300;400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/kankana-app.css">
<style>
  .fb-wrap{max-width:640px;margin:0 auto;}
  .fb-wrap form{display:grid;gap:22px;}
  .q-l{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:block;}
  .rate{display:flex;gap:6px;}
  .rate button{font-size:38px;line-height:1;background:none;border:none;cursor:pointer;color:var(--line);padding:2px 4px;transition:color .2s,transform .2s;}
  .rate button.on{color:var(--gold);}
  .rate button:hover{transform:scale(1.08);}
  .rate-t{font-family:'Cormorant Garamond',serif;font-size:20px;font-style:italic;color:var(--gold-deep);min-height:1.3em;margin-top:6px;}
  .fb-wrap textarea{width:100%;font:inherit;font-size:15px;line-height:1.6;padding:12px 14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);resize:vertical;}
  .nps{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:4px;}
  .nps button{padding:10px 0;border:1px solid var(--line);background:var(--paper);font:inherit;font-size:14px;cursor:pointer;color:var(--ink);}
  .nps button.on{background:var(--ink);color:var(--cream);border-color:var(--ink);}
  .nps-l{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:6px;}
  .consent{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.55;}
  .consent input{margin-top:4px;accent-color:var(--ink);}
  .refs{border-top:1px solid var(--line-soft);padding-top:22px;}
  .refs h3{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:26px;}
  .refs p{font-size:14px;line-height:1.7;color:var(--muted);margin:6px 0 14px;}
  .ref{display:grid;grid-template-columns:1.2fr 1fr 1.2fr;gap:10px;margin-bottom:10px;}
  .addref{background:none;border:none;color:var(--gold-deep);font:inherit;font-size:14px;cursor:pointer;padding:0;text-decoration:underline;}
  .err{color:var(--red);font-size:14px;min-height:1.2em;}
  .done{text-align:center;padding:30px 10px;}
  .done h2{font-size:38px;line-height:1.15;}
  .done p{font-size:15px;line-height:1.8;margin-top:12px;color:var(--muted);}
  @media(max-width:640px){.ref{grid-template-columns:1fr;padding-bottom:10px;border-bottom:1px solid var(--line-soft);}.nps{grid-template-columns:repeat(6,minmax(0,1fr));}.rate button{font-size:34px;}}
</style>
</head>
<body>
<nav class="k-nav">
  <a class="logo" href="index.html">Kankana</a>
  <div class="links"><a href="index.html#venues" class="hide-m">Venues</a><a href="book.html">Book</a><a href="my-booking.html">My Booking</a></div>
</nav>

<header class="k-head">
  <div class="eyebrow">Thank you for celebrating with us</div>
  <h1 id="fbH">How was it?</h1>
  <p id="fbP">A few words from you help our team — and help other families decide.</p>
</header>

<main class="k-wrap">
  <section class="fb-wrap card" id="fbBox"><div class="muted" style="text-align:center">Loading…</div></section>
</main>

<div class="k-footer">© 2026 Kankana. All rights reserved. <a href="index.html">Home</a><a href="book.html">Book</a></div>
<script src="assets/feedback.js"></script>
</body>
</html>
